name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Hooks (ruff, gitleaks secret scan, hygiene)
        env:
          # Already run by the backend and frontend jobs, with their environments installed.
          SKIP: mypy,oxlint,prettier
        run: uvx pre-commit run --all-files --show-diff-on-failure

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (with coverage)
        run: uv run pytest
      - name: Coverage summary
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Dependency audit (production packages)
        # Fails on any known vulnerability in what ships; the lockfile pins and hashes every package.
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --requirement "$RUNNER_TEMP/requirements.txt" --disable-pip --progress-spinner off
      - name: OpenAPI schema for the frontend is up to date
        run: |
          uv run python -m scripts.export_openapi ../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit (production packages)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests (with coverage)
        run: npm run test:coverage
      - name: Generated API types match openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts
      - name: Build
        run: npm run build

  docker:
    # Nobody needs Docker locally: this job proves the image builds, serves /health, and stays
    # inside Render Free's memory under load.
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t app-backend backend
      - name: Smoke test /health
        run: |
          # Same memory as Render Free, so running out of memory fails here, not in production.
          docker run -d --name app --memory 512m -p 8000:8000 app-backend
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 \
            http://localhost:8000/health
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Memory under load (4 concurrent near-5 MB CVs, peak under 400 MB)
        working-directory: backend
        run: |
          uv sync --locked
          uv run python -m scripts.memory_check --container app --limit-mb 400
      - name: Container logs on failure
        if: failure()
        run: docker logs app
