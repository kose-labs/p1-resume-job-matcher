name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Hooks (ruff, gitleaks secret scan, hygiene)
        env:
          # Already run by the backend and frontend jobs, with their environments installed.
          SKIP: mypy,oxlint,prettier
        run: uvx pre-commit run --all-files --show-diff-on-failure

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    # Nobody needs Docker locally: this job proves the image builds and serves /health.
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t app-backend backend
      - name: Smoke test /health
        run: |
          docker run -d --name app -p 8000:8000 app-backend
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 \
            http://localhost:8000/health
      - name: Container logs on failure
        if: failure()
        run: docker logs app
