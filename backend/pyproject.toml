[project]
name = "app"
version = "0.2.0"
description = "KoSe Labs service backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.0",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.33",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "duckdb>=2.0.0",
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D1"]

[tool.ruff.lint.per-file-ignores]
# Test names already say what they check.
"tests/**" = ["D1"]

[tool.mypy]
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Every test run measures coverage, locally and in CI.
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Floor, not target: raise it as the project grows, never lower it to make CI pass.
fail_under = 80

[[tool.mypy.overrides]]
# scikit-learn and SciPy ship without type hints.
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true
