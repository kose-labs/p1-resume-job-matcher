[project]
name = "k8-embeddings"
version = "0.1.0"
description = "P1 K8: compare embedding models for CV-JD matching under the 512 MB budget (ADR-0004)"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.6",
    "model2vec>=0.6",
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D1"]
