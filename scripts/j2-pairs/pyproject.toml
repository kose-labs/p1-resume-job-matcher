[project]
name = "j2-pairs"
version = "0.1.0"
description = "P1 J2: build the rated pair set, check rater agreement, evaluate model scores"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D1"]
