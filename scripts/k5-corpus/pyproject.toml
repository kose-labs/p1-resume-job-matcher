[project]
name = "k5-corpus"
version = "0.1.0"
description = "P1 K5: build the evaluation corpus from the Djinni dataset (ADR-0001)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D1"]
