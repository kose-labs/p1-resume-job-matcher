[project]
name = "s6-pdf-parsers"
version = "0.1.0"
description = "P1 S6 experiment: compare pypdf, pdfplumber and PyMuPDF on CV PDFs (ADR-0003)"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "psutil>=6.0",
    "pymupdf>=1.24",
    "pypdf>=5.0",
    "reportlab>=4.2",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D1"]
